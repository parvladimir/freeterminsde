name: Check Urologie Marl appointments

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: urologie-marl-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save state and diagnostics
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add state.json last_response.html || true
          git diff --cached --quiet || git commit -m "Update appointment monitor"
          git pull --rebase
          git push
